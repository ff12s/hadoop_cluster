kyuubi.frontend.bind.host 0.0.0.0
kyuubi.frontend.protocols THRIFT_BINARY
kyuubi.frontend.thrift.binary.bind.port 10009

kyuubi.engine.type SPARK_SQL
kyuubi.engine.share.level SERVER
kyuubi.session.engine.initialize.timeout 300000

kyuubi.ha.enabled false

spark.master yarn
spark.submit.deployMode client
spark.yarn.historyServer.address spark-history:18080
spark.eventLog.enabled true
spark.eventLog.dir hdfs://namenode:9000/spark-events
spark.history.fs.logDirectory hdfs://namenode:9000/spark-events
spark.sql.warehouse.dir hdfs://namenode:9000/user/hive/warehouse

# OpenLineage: конфиг вынесен из общего spark-defaults.conf (ломал spark-shell).
# Kyuubi пробрасывает эти spark.* в порождаемый engine. URL/namespace захардкожены —
# файл статичный, env не подставляется (консистентно с namenode:9000 выше).
spark.extraListeners io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type http
spark.openlineage.transport.url http://marquez:5000
spark.openlineage.namespace hadoop-cluster
spark.openlineage.columnLineage.datasetLineageEnabled true

